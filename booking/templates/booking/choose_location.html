<!DOCTYPE html>
<html>
<head>
    <title>Choose Location | PickMeNow.Online</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card mx-auto shadow border-0 rounded-4" style="max-width: 480px;">

        <div class="card-body p-4">

            <h3 class="fw-bold text-center mb-2">Choose Your Area</h3>

            <p class="text-muted text-center">
                Select your current service area for PickMeNow.Online.
            </p>

            {% if error %}
                <div class="alert alert-danger rounded-4">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-bold">Location / Area</label>

                    <select name="location_id" class="form-select rounded-3" required>
                        <option value="">Select location</option>

                        {% for location in locations %}
                            <option value="{{ location.id }}">
                                {{ location.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-warning w-100 fw-bold rounded-3">
                    Continue
                </button>
            </form>

        </div>

    </div>

</div>

</body>
</html>
